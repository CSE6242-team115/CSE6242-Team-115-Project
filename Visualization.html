<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Met Objects — Similarity Star</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; }
    header { padding: 12px 16px; background: #f6f8fa; border-bottom: 1px solid #e5e7eb; display:flex; gap:8px; align-items:center; }
    input[type="text"] { padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; width: 420px; }
    button { padding: 8px 12px; border: 1px solid #d1d5db; background: white; border-radius: 8px; cursor: pointer; }
    button:hover { background: #f3f4f6; }
    .hint { color:#6b7280; font-size: 12px; margin-left: 6px; }
    svg { display:block; background:white; }

    path.link { fill: none; stroke: #9ca3af; stroke-width: 1.5px; opacity: 0.85; } /* constant width now */
    g.node text { fill: #111827; font: 11px/1.2 sans-serif; pointer-events: none; text-anchor: middle; }
    g.node circle { stroke: #374151; stroke-width: 1px; }

    #info {
      position: fixed; right: 16px; top: 64px; width: 340px; max-height: 75vh; overflow:auto;
      background: #ffffff; border:1px solid #e5e7eb; border-radius: 12px; padding: 12px 14px; box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      font-size: 13px;
    }
    #info h3 { margin: 0 0 6px 0; font-size: 15px; }
    #info .k { color:#6b7280; }
    #legend { position: fixed; left: 16px; top: 64px; background: #ffffff; border:1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px; font-size:12px; }
  </style>
  <script src="https://d3js.org/d3.v5.min.js" defer></script>
</head>
<body>
  <header>
    <label for="mainTitle"><strong>Main Title:</strong></label>
    <input id="mainTitle" type="text" placeholder="Type an exact Title from the CSV…" />
    <button id="buildBtn">Build graph</button>
    <span class="hint">Circle size = number of matching fields with the main item.</span>
  </header>

  <div id="legend">Circle size = matches with main. Nodes are spaced using strong repulsion + collision.</div>
  <div id="info">Click a node to see details here.</div>

  <script>
  document.addEventListener("DOMContentLoaded", function () {
    const width = Math.min(window.innerWidth, 1200);
    const height = 760;

    const csvPath = "MetObjects-Cleaned-20sample.csv";

    const columns = [
      "Object Number","Object ID","Gallery Number","Department","AccessionYear",
      "Object Name","Title","Culture","Period","Dynasty","Reign","Portfolio",
      "Artist Nationality","Object Begin Date","Object End Date","City","State","County",
      "Country","Region","Subregion","Locale","Classification","Tags"
    ];

    const svg = d3.select("body").append("svg")
      .attr("width", width)
      .attr("height", height);

    const info = d3.select("#info");

    const norm = v => {
      if (v === undefined || v === null) return null;
      const s = String(v).trim();
      if (!s || s.toLowerCase() === "null" || s.toLowerCase() === "nan") return null;
      return s;
    };
    const normKey = v => (v == null ? null : String(v).trim().toLowerCase());

    let dataRows = [];

    d3.csv(csvPath).then(rows => {
      dataRows = rows;
      const firstTitle = rows.find(r => norm(r.Title))?.Title || "";
      d3.select("#mainTitle").property("value", firstTitle);
    }).catch(err => {
      console.error("CSV load error:", err);
      info.html("<b>Could not load CSV.</b> Make sure the file is in the same folder and not tracked by Git LFS.");
    });

    d3.select("#buildBtn").on("click", () => {
      const titleInput = d3.select("#mainTitle").property("value") || "";
      buildGraph(titleInput);
    });

    function buildGraph(mainTitleRaw) {
      svg.selectAll("*").remove(); // clear

      const gLinks = svg.append("g");
      const gNodes = svg.append("g");

      const mainTitle = norm(mainTitleRaw);
      if (!mainTitle) {
        info.html("<b>Please type a Title from the CSV and click Build graph.</b>");
        return;
      }

      const mainRow = dataRows.find(r => normKey(r.Title) === normKey(mainTitle));
      if (!mainRow) {
        info.html(`<b>No exact Title match found:</b> "${mainTitleRaw}". Try copy/paste from the CSV.`);
        return;
      }

      const nodesMap = new Map();
      function makeId(row) {
        const objNo = norm(row["Object Number"]);
        return objNo || norm(row.Title) || ("id_" + Math.random().toString(36).slice(2));
      }

      const mainId = makeId(mainRow);
      nodesMap.set(mainId, { id: mainId, title: norm(mainRow.Title) || "(Untitled)", row: mainRow, main: true, matchCount: 0 });

      const links = [];
      const mainNorms = {};
      columns.forEach(c => mainNorms[c] = normKey(mainRow[c]));

      dataRows.forEach(row => {
        if (row === mainRow) return;
        let matchCount = 0;
        const matchedCols = [];
        columns.forEach(c => {
          const a = mainNorms[c];
          const b = normKey(row[c]);
          if (a && b && a === b) { matchCount++; matchedCols.push(c); }
        });
        if (matchCount > 0) {
          const id = makeId(row);
          if (!nodesMap.has(id)) {
            nodesMap.set(id, { id, title: norm(row.Title) || "(Untitled)", row, main: false, matchCount }); // CHANGED: store matchCount on node
          } else {
            // if duplicate id somehow, keep max matches
            nodesMap.get(id).matchCount = Math.max(nodesMap.get(id).matchCount, matchCount);
          }
          links.push({ source: mainId, target: id, value: matchCount, matchedCols });
        }
      });

      const nodes = Array.from(nodesMap.values());
      if (nodes.length === 1) {
        info.html(`<b>Only the main node found.</b> No other items share fields with "<i>${nodes[0].title}</i>".`);
      }

      // CHANGED: radius scales by matchCount (neighbors) and a fixed size for main
      const mcVals = nodes.filter(n => !n.main).map(n => n.matchCount);
      const mcMin = mcVals.length ? Math.min(...mcVals) : 1;
      const mcMax = mcVals.length ? Math.max(...mcVals) : 1;
      const rScale = d3.scaleSqrt().domain([mcMin, mcMax]).range([10, 40]); // bigger circles

      // color can also reflect matches (darker = more matches)
      const color = d3.scaleSequential()
        .domain([mcMin, mcMax])
        .interpolator(d3.interpolateHsl("hsl(210,70%,90%)", "hsl(210,90%,30%)"));

      // CHANGED: stronger spacing — longer links, stronger repulsion, and collision force
      const sim = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links)
          .id(d => d.id)
          .distance(d => 240 + Math.max(0, 20 * (mcMax - (d.value || 1)))) // longer base distance
          .strength(0.8))
        .force("charge", d3.forceManyBody().strength(-800)) // stronger repulsion
        .force("center", d3.forceCenter(width/2, height/2))
        .force("collide", d3.forceCollide().radius(d => (d.main ? 46 : rScale(d.matchCount) + 16)).iterations(2)) // CHANGED
        .alpha(1)
        .alphaTarget(0.2)
        .on("tick", ticked);

      // Pin main node
      const mainNode = nodes.find(n => n.main);
      if (mainNode) {
        mainNode.fx = width / 2;
        mainNode.fy = height / 2;
      }

      // Links (constant width now)
      const link = gLinks.selectAll("path.link")
        .data(links)
        .enter()
        .append("path")
        .attr("class", "link")
        .append("title")
        .text(d => `Shared fields (${d.value}): ${d.matchedCols.join(", ")}`);

      // Nodes
      const node = gNodes.selectAll("g.node")
        .data(nodes)
        .enter()
        .append("g")
        .attr("class", "node")
        .call(d3.drag()
          .on("start", dragstarted)
          .on("drag", dragged)
          .on("end", dragended))
        .on("click", showDetails);

      node.append("circle")
        .attr("r", d => d.main ? 46 : rScale(d.matchCount)) // CHANGED
        .style("fill", d => d.main ? "#ffb4c2" : color(d.matchCount))
        .style("stroke-width", d => d.main ? 2 : 1.2);

      // Put label BELOW the circle and add extra padding
      node.append("text")
        .attr("dy", d => (d.main ? 46 : rScale(d.matchCount)) + 14) // CHANGED
        .text(d => d.title)
        .style("font-weight", d => d.main ? "700" : "500");

      function ticked() {
        gLinks.selectAll("path.link").attr("d", d => {
          return `M${d.source.x},${d.source.y} L${d.target.x},${d.target.y}`;
        });
        gNodes.selectAll("g.node").attr("transform", d => `translate(${d.x},${d.y})`);
      }

      function dragstarted(d) {
        if (d.main) return; // keep main pinned
        if (!d3.event.active) sim.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
      }
      function dragged(d) {
        if (d.main) return;
        d.fx = d3.event.x; d.fy = d3.event.y;
      }
      function dragended(d) {
        if (d.main) { d.fx = width/2; d.fy = height/2; return; }
        if (!d3.event.active) sim.alphaTarget(0);
        d.fx = d.x; d.fy = d.y;
      }

      function showDetails(d) {
        const row = d.row || {};
        const nonNullPairs = [];
        columns.forEach(c => {
          const v = norm(row[c]);
          if (v !== null) nonNullPairs.push([c, v]);
        });

        let shared = [];
        if (!d.main) {
          const sharedCols = [];
          columns.forEach(c => {
            const a = normKey(mainRow[c]);
            const b = normKey(row[c]);
            if (a && b && a === b) sharedCols.push(c);
          });
          shared = sharedCols;
        }

        info.html("");
        info.append("h3").text(d.title + (d.main ? " (Main)" : ""));
        if (!d.main) {
          info.append("div").style("margin","4px 0 8px 0")
              .html(`<b>Shared with main (${d.matchCount}):</b> ${shared.join(", ")}`);
        } else {
          info.append("div").style("margin","4px 0 8px 0")
              .html(`<b>Main node pinned at center.</b>`);
        }
        const dl = info.append("div");
        nonNullPairs.forEach(([k, v]) => {
          const line = dl.append("div").style("margin","2px 0");
          line.append("span").attr("class","k").text(k + ": ");
          line.append("span").text(v);
        });
        if (nonNullPairs.length === 0) {
          info.append("div").text("No non-null fields to display.");
        }
      }
    }
  });
  </script>
</body>
</html>
