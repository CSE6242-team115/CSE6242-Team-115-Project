<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Met Objects — Similarity Star (recommendations)</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; }
    header { padding: 12px 16px; background: #f6f8fa; border-bottom: 1px solid #e5e7eb; display:flex; gap:8px; align-items:center; }
    .hint { color:#6b7280; font-size: 12px; margin-left: 6px; }
    svg { display:block; background:white; }

    path.link { fill: none; stroke: #9ca3af; stroke-width: 1.5px; opacity: 0.85; }
    g.node text { fill: #111827; font: 16px/1.2 sans-serif; pointer-events: none; text-anchor: middle; }
    g.node circle { stroke: #374151; stroke-width: 1px; }

    #info {
      position: fixed; top: 64px; left: 50%; transform: translateX(-50%); width: 720px; max-height: 75vh; overflow:auto;
      background: #ffffff; border:1px solid #e5e7eb; border-radius: 12px; padding: 12px 14px; box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      font-size: 13px;
    }
    #info h3 { margin: 0 0 6px 0; font-size: 15px; }
    #info .k { color:#6b7280; }
        #similarTable {
      position: fixed;
      right: 16px;
      top: 64px;
      width: 500px;
      max-height: calc(100vh - 80px);
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
    }
    
    #similarTable h3 {
      margin: 0;
      padding: 12px 14px;
      font-size: 15px;
      border-bottom: 1px solid #e5e7eb;
      background: #f9fafb;
      border-radius: 12px 12px 0 0;
    }
    
    #tableContainer {
      overflow-y: auto;
      flex: 1;
    }
    
    #similarTable table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    
    #similarTable th {
      position: sticky;
      top: 0;
      background: #f9fafb;
      padding: 8px 10px;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid #e5e7eb;
      z-index: 10;
    }
    
    #similarTable td {
      padding: 8px 10px;
      border-bottom: 1px solid #f3f4f6;
    }
    
    #similarTable tr:hover {
      background: #f9fafb;
      cursor: pointer;
    }
    
    #similarTable .rank {
      width: 40px;
      text-align: center;
      color: #6b7280;
      font-weight: 600;
    }
    
    #similarTable .score {
      width: 60px;
      text-align: right;
      font-weight: 600;
      color: #059669;
    }
    
    #similarTable .title {
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #legend { position: fixed; left: 16px; top: 64px; background: #ffffff; border:1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px; font-size:12px; }
  </style>
  <script src="https://d3js.org/d3.v5.min.js" defer></script>
</head>
<body>
  <header>
    <strong>Similarity Star</strong>
    <input id="searchBox" type="text" placeholder="Search by Object Number or Title…" />
    <span class="hint">Press Enter to visualize.</span>
</header>
<div id="legend">Main pinned at center. Neighbors sized by similarity_score.</div>
<div id="similarTable" style="display:none;">
    <h3>Top 20 Similar Objects</h3>
    <div id="tableContainer">
      <table>
        <thead>
          <tr>
            <th class="rank">#</th>
            <th class="title">Title</th>
            <th class="score">Score</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
<div id="info">Loading full dataset…</div>

<script>
document.addEventListener("DOMContentLoaded", async function() {
  const width = Math.min(window.innerWidth, 1200);
  const height = 1400;

  const svg = d3.select("body").append("svg")
    .attr("width", width)
    .attr("height", height);
  const gWrapper = svg.append("g")
    .attr("transform", "translate(200, -120) scale(0.80)");
  const gLinks = gWrapper.append("g").attr("class", "links");
  const gNodes = gWrapper.append("g").attr("class", "nodes");
  const info = d3.select("#info");

  const jsonPath = "artworksGalNumKnown.json";
  let allData = null;

  try {
    allData = await d3.json(jsonPath);
    info.html("Dataset loaded. Search for an Object Number or Title above.");
  } catch (e) {
    info.html("<b>Could not load artworksGalNumKnown.json.</b>");
    return;
  }

  // --- Search input event ---
  const searchInput = document.getElementById("searchBox");
  searchInput.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      const query = searchInput.value.trim().toLowerCase();
      if (!query) return;
      let key = Object.keys(allData).find(k => k.toLowerCase() === query);
      if (!key) {
        // fallback: match by title substring
        key = Object.keys(allData).find(k =>
          (allData[k].title || "").toLowerCase().includes(query)
        );
      }
    if (!key) {
        similarTable.querySelector("h3").textContent = "No match found.";
        similarTable.style.display = "flex";
        tableBody.innerHTML = "";
        return;
      }
      console.log("Found key:", key);
      console.log("Full record:", allData[key]);
      renderGraph(allData[key]);
    }
  });

  // --- function to truncate titles ---
  function truncateTitle(title, maxLen = 100) {
    if (!title) return "";
    return title.length > maxLen ? title.slice(0, maxLen - 1) + "…" : title;
  }

  function renderGraph(mainRec) {
    gNodes.selectAll("*").remove();
    gLinks.selectAll("*").remove();

    const mainId = mainRec.index;
    const mainKey = Object.keys(allData).find(k => allData[k].index === mainRec.index);
    const nodes = [{
      id: mainId,
      title: mainRec.title,
      main: true,
      score: 0,
      objectID: mainKey,
      artist: (mainRec.artist || []).join(", "),
      year: mainRec.object_date || "Unknown",
      galleryNumber: mainRec.gallery_number || "Unknown",
      imgurl: mainRec.imgurl
    }];
    const links = [];

    (mainRec.similar_neighbors_scored || []).forEach(n => {
  const targetKey = Object.keys(allData).find(k => allData[k].index === n.index);
  const targetRec = allData[targetKey];
  if (!targetRec) return;
  nodes.push({
    id: targetRec.index,
    title: targetRec.title,
    main: false,
    score: n.score,
    objectID: targetKey,
    artist: (targetRec.artist || []).join(", "),
    year: targetRec.object_date || "Unknown",
    galleryNumber: targetRec.gallery_number || "Unknown",
    imgurl: targetRec.imgurl
  });
  links.push({ source: mainId, target: targetRec.index, value: n.score });
  });

  // --- Populate the table ---
    similarTable.style.display = "flex";
    similarTable.querySelector("h3").textContent = `Similar to: ${truncateTitle(mainRec.title, 40)}`;
    tableBody.innerHTML = "";
    
    const similarNodes = nodes.filter(d => !d.main).sort((a, b) => b.score - a.score);
    similarNodes.forEach((node, idx) => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td class="rank">${idx + 1}</td>
        <td class="title" title="${node.title}">${truncateTitle(node.title, 40)}</td>
        <td class="score">${node.score.toFixed(1)}</td>
      `;
      row.addEventListener("click", () => showDetails(node));
      row.addEventListener("dblclick", () => renderGraph(allData[node.objectID]))
      tableBody.appendChild(row);
    });

    const scores = nodes.filter(d => !d.main).map(d => d.score);
    const sMin = Math.min(...scores);
    const sMax = Math.max(...scores);
    const rScale = d3.scaleSqrt().domain([sMin, sMax]).range([14, 52]);
    const nodeColor = d3.scaleSequential()
      .domain([sMin, sMax])
      .interpolator(d3.interpolateHsl("hsl(210,70%,90%)", "hsl(210,90%,30%)"));

    // Add margins to prevent text cutoff
    const BASE_DISTANCE = 285;
    const CHARGE = -1200;
    const LABEL_PAD = 65;

    // Balanced margins to prevent label cutoff
    const MARGIN_LEFT = 200;
    const MARGIN_RIGHT = 200;
    const usableWidth = width - MARGIN_LEFT - MARGIN_RIGHT;

    const sim = d3.forceSimulation(nodes)
      .force("link", d3.forceLink(links).id(d => d.id)
        .distance(l => BASE_DISTANCE)
        .strength(0.85))
      .force("charge", d3.forceManyBody().strength(CHARGE))
      .force("center", d3.forceCenter(MARGIN_LEFT + usableWidth / 2, height / 2))
      .force("collide", d3.forceCollide().radius(d => (d.main ? 58 : rScale(d.score)) + LABEL_PAD))
      .alpha(1).alphaTarget(0.15)
      .on("tick", ticked);

    const mainNode = nodes.find(n => n.main);
    if (mainNode) { mainNode.fx = width/2; mainNode.fy = height/2; }

    gLinks.selectAll("path.link")
      .data(links).enter().append("path")
      .attr("class", "link")
      .style("stroke-width", d => 1 + (d.value || 0)/20);

    const node = gNodes.selectAll("g.node")
      .data(nodes).enter().append("g")
      .attr("class", "node")
      .on("click", showDetails)
      .on("dblclick", d => renderGraph(allData[d.objectID]));

    node.append("circle")
      .attr("r", d => d.main ? 58 : rScale(d.score))
      .style("fill", d => d.main ? "#ffb4c2" : nodeColor(d.score));

    node.append("svg:image")
      .attr("xlink:href", d => d.imgurl)
      .attr("x", d => d.main ? -45 : -rScale(d.score) * 0.77)
      .attr("y", d => d.main ? -45 : -rScale(d.score) * 0.77)
      .style("width", d => (d.main ? 90 : rScale(d.score) * 1.5).toString() + "px")
      .style("height", d => (d.main ? 90 : rScale(d.score) * 1.5).toString() + "px")
    
    node.append("text")
      .attr("dy", d => (d.main ? 72 : rScale(d.score) + 14))
      .text(d => truncateTitle(d.title, 75))
      .style("font-weight", d => d.main ? "700" : "500");

    node.append("text")
      .attr("dy", d => (d.main ? 88 : rScale(d.score) + 30))
      .text(d => d.objectID)
      .style("font-weight", d => d.main ? "700" : "500");

    info.html("Dataset loaded. Search for an Object Number or Title above. Double-click a node or table entry to see similar pieces.");

    function ticked() {
      const pad = 200; // adds both left/right breathing room
      nodes.forEach(d => {
        d.x = Math.max(pad, Math.min(width - pad, d.x));
        d.y = Math.max(pad, Math.min(height - pad, d.y));
      });
      gLinks.selectAll("path.link")
        .attr("d", d => `M${d.source.x},${d.source.y} L${d.target.x},${d.target.y}`);
      gNodes.selectAll("g.node")
        .attr("transform", d => `translate(${d.x},${d.y})`);
    }

    function showDetails(d) {
      // Highlight the selected row in the table
      const rows = tableBody.querySelectorAll("tr");
      rows.forEach(row => row.style.background = "");
      
      const nodeIndex = similarNodes.findIndex(n => n.id === d.id);
      if (nodeIndex >= 0) {
        rows[nodeIndex].style.background = "#dbeafe";
      }
      
      // Update table header with details
      const header = similarTable.querySelector("h3");
      header.innerHTML = `
        <div style="font-size: 14px; font-weight: 600;">${truncateTitle(d.title, 40)}</div>
        <div style="display: flex; gap: 12px; font-size: 12px; color: #6b7280; margin-top: 4px;">
          <div><b>Object Number:</b> ${d.objectID}</div>
          <div><b>Artist:</b> ${d.artist || "Unknown"}</div>
          <div><b>Year:</b> ${d.year}</div>
          <div><b>Gallery:</b> ${d.galleryNumber || "Unknown"}</div>
          ${d.main ? "" : `<div><b>Similarity Score:</b> ${d.score.toFixed(1)}</div>`}
        </div>
      `;
    }
  }
});
</script>
</body>
</html>
