<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Met Objects — Similarity Star (recommendations)</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; }
    header { padding: 12px 16px; background: #f6f8fa; border-bottom: 1px solid #e5e7eb; display:flex; gap:8px; align-items:center; }
    .hint { color:#6b7280; font-size: 12px; margin-left: 6px; }
    svg { display:block; background:white; }

    path.link { fill: none; stroke: #9ca3af; stroke-width: 1.5px; opacity: 0.85; }
    g.node text { fill: #111827; font: 16px/1.2 sans-serif; pointer-events: none; text-anchor: middle; }
    g.node circle { stroke: #374151; stroke-width: 1px; }

    #info {
      position: fixed; right: 16px; top: 64px; width: 360px; max-height: 75vh; overflow:auto;
      background: #ffffff; border:1px solid #e5e7eb; border-radius: 12px; padding: 12px 14px; box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      font-size: 13px;
    }
    #info h3 { margin: 0 0 6px 0; font-size: 15px; }
    #info .k { color:#6b7280; }
    #legend { position: fixed; left: 16px; top: 64px; background: #ffffff; border:1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px; font-size:12px; }
  </style>
  <script src="https://d3js.org/d3.v5.min.js" defer></script>
</head>
<body>
  <header>
    <strong>Similarity Star</strong>
    <span class="hint">Loaded from <code>recommendations</code> (no extension) or <code>recommendations.csv</code>. Main = <code>source_role="main"</code>. Circle size = <code>similarity_score</code>.</span>
  </header>

  <div id="legend">Main pinned at center. Neighbors sized by <em>similarity_score</em>. Edges use base distance = 200.</div>
  <div id="info">Loading…</div>

  <script>
  document.addEventListener("DOMContentLoaded", function () {
    const width = Math.min(window.innerWidth, 1200);
    const height = 1520; // ⬆ doubled vertical height

    const CANDIDATE_PATHS = [
      "recommendations",
      "./recommendations",
      "recommendations.csv",
      "./recommendations.csv"
    ];

    const COLUMNS = [
      "Object Number","Object ID","Gallery Number","Department","AccessionYear",
      "Object Name","Title","Culture","Period","Dynasty","Reign","Portfolio",
      "Artist Nationality","Object Begin Date","Object End Date","City","State","County",
      "Country","Region","Subregion","Locale","Classification","Tags"
    ];

    const svg = d3.select("body").append("svg")
      .attr("width", width)
      .attr("height", height);

    const gWrapper = svg.append("g")
      .attr("transform", "translate(75, -120) scale(0.80)"); // shift upward 200px

    const gLinks = gWrapper.append("g").attr("class", "links");
    const gNodes = gWrapper.append("g").attr("class", "nodes");

    const info  = d3.select("#info");

    const norm = v => {
      if (v === undefined || v === null) return null;
      const s = String(v).trim();
      if (!s || s.toLowerCase() === "null" || s.toLowerCase() === "nan") return null;
      return s;
    };

    function getVal(row, name) {
      const spaced = name;
      const underscored = name.replace(/\s+/g, "_");
      return Object.prototype.hasOwnProperty.call(row, spaced) ? row[spaced]
           : Object.prototype.hasOwnProperty.call(row, underscored) ? row[underscored]
           : undefined;
    }

    function detectDelimiter(text) {
      const firstLine = (text.split(/\r?\n/)[0] || "").replace(/^\uFEFF/, "");
      const counts = { ",": (firstLine.match(/,/g) || []).length, "\t": (firstLine.match(/\t/g) || []).length, ";": (firstLine.match(/;/g) || []).length };
      const best = Object.entries(counts).sort((a,b) => b[1]-a[1])[0];
      return (best && best[1] > 0) ? best[0] : ",";
    }

    (async function loadAndRender() {
      let pickedPath = null, text = null;
      for (const p of CANDIDATE_PATHS) {
        try { text = await d3.text(p); if (text && text.trim().length > 0) { pickedPath = p; break; } }
        catch (e) {}
      }

      if (!pickedPath) {
        info.html(`<b>Could not load recommendations file.</b> Ensure it exists and your local server is running.`);
        return;
      }

      const clean = text.replace(/^\uFEFF/, "");
      const delim = detectDelimiter(clean);
      const parser = d3.dsvFormat(delim);
      const rows = parser.parse(clean).map(r => ({
        ...r,
        similarity_score: (r.similarity_score === "" || r.similarity_score == null) ? null : +r.similarity_score
      }));

      if (!rows.length) { info.html("<b>File loaded but empty.</b>"); return; }

      const mainRows = rows.filter(r => String((r.source_role || r.Source_Role || "")).toLowerCase() === "main");
      if (mainRows.length === 0) { info.html("<b>No row with source_role == 'main'.</b>"); return; }
      const mainRow = mainRows[0];
      const neighbors = rows.filter(r => String((r.source_role || r.Source_Role || "")).toLowerCase() === "neighbor");

      const nodes = [];
      const links = [];

      const mainId = norm(getVal(mainRow, "Object Number")) || norm(getVal(mainRow, "Title")) || "MAIN";
      nodes.push({ id: mainId, title: norm(getVal(mainRow, "Title")) || "(Untitled)", row: mainRow, main: true, score: 0 });

      neighbors.forEach(r => {
        const id = norm(getVal(r, "Object Number")) || norm(getVal(r, "Title")) || Math.random().toString(36).slice(2);
        const score = Number.isFinite(r.similarity_score) ? r.similarity_score : 0;
        nodes.push({ id, title: norm(getVal(r, "Title")) || "(Untitled)", row: r, main: false, score });
        links.push({ source: mainId, target: id, value: score });
      });

      const scores = neighbors.map(r => r.similarity_score).filter(Number.isFinite);
      const sMin = scores.length ? Math.min(...scores) : 1;
      const sMax = scores.length ? Math.max(...scores) : 1;
      const rScale = d3.scaleSqrt().domain([sMin, sMax]).range([14, 52]);
      const color  = d3.scaleSequential().domain([sMin, sMax])
        .interpolator(d3.interpolateHsl("hsl(210,70%,90%)", "hsl(210,90%,30%)"));
      const nodeRadius = d => d.main ? 58 : rScale(d.score);

      // Adjusted for requested edge length
      const BASE_DISTANCE = 285;   // << you can change this value anytime
      const CHARGE = -1200;
      const LABEL_PAD = 65;

      const sim = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links)
          .id(d => d.id)
          .distance(l => BASE_DISTANCE + nodeRadius(l.source) + nodeRadius(l.target))
          .strength(0.85))
        .force("charge", d3.forceManyBody().strength(CHARGE))
        .force("center", d3.forceCenter(width/2, height/2))
        .force("collide", d3.forceCollide().radius(d => nodeRadius(d) + LABEL_PAD).iterations(3))
        .alpha(1).alphaTarget(0.15)
        .on("tick", ticked);

      const mainNode = nodes.find(n => n.main);
      if (mainNode) { mainNode.fx = width/2; mainNode.fy = height/2; }

      gLinks.selectAll("path.link")
        .data(links).enter().append("path")
        .attr("class", "link")
        .style("stroke-width", d => 1 + (d.value || 0) / 20)
        .append("title")
        .text(d => `Similarity score: ${d.value ?? "n/a"}`);

      const node = gNodes.selectAll("g.node")
        .data(nodes).enter().append("g")
        .attr("class", "node")
        .call(d3.drag()
          .on("start", dragstarted)
          .on("drag", dragged)
          .on("end", dragended))
        .on("click", showDetails);

      node.append("circle")
        .attr("r", d => nodeRadius(d))
        .style("fill", d => d.main ? "#ffb4c2" : color(d.score))
        .style("stroke-width", d => d.main ? 2 : 1.2);

      node.append("text")
        .attr("dy", d => nodeRadius(d) + 14)
        .text(d => d.title)
        .style("font-weight", d => d.main ? "700" : "500");

      function ticked() {
        const pad = 80;
        nodes.forEach(d => {
          d.x = Math.max(pad, Math.min(width - pad, d.x));
          d.y = Math.max(pad, Math.min(height - pad, d.y));
        });
        gLinks.selectAll("path.link").attr("d", d => `M${d.source.x},${d.source.y} L${d.target.x},${d.target.y}`);
        gNodes.selectAll("g.node").attr("transform", d => `translate(${d.x},${d.y})`);
      }

      function dragstarted(d) { if (!d3.event.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
      function dragged(d) { d.fx = d3.event.x; d.fy = d3.event.y; }
      function dragended(d) { if (!d3.event.active) sim.alphaTarget(0); if (d.main) { d.fx = width/2; d.fy = height/2; } }

      function showDetails(d) {
        const row = d.row || {};
        const nonNullPairs = [];
        COLUMNS.forEach(c => { const v = norm(getVal(row, c)); if (v !== null) nonNullPairs.push([c, v]); });

        info.html("");
        info.append("h3").text((getVal(row, "Title") || "(Untitled)") + (d.main ? " (Main)" : ""));
        if (!d.main && Number.isFinite(d.score)) info.append("div").html(`<b>Similarity score:</b> ${d.score}`);
        else if (d.main) info.append("div").html(`<b>Main node pinned at center.</b>`);

        const dl = info.append("div");
        nonNullPairs.forEach(([k, v]) => {
          const line = dl.append("div").style("margin","2px 0");
          line.append("span").attr("class","k").text(k + ": ");
          line.append("span").text(v);
        });
      }
    })();
  });
  </script>
</body>
</html>
