<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Met Objects — Similarity Star (Object Number input)</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; }
    header { padding: 12px 16px; background: #f6f8fa; border-bottom: 1px solid #e5e7eb; display:flex; gap:8px; align-items:center; flex-wrap: wrap; }
    input[type="text"] { padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; width: 420px; }
    button { padding: 8px 12px; border: 1px solid #d1d5db; background: white; border-radius: 8px; cursor: pointer; }
    button:hover { background: #f3f4f6; }
    .hint { color:#6b7280; font-size: 12px; margin-left: 6px; }
    svg { display:block; background:white; }
    path.link { fill: none; stroke: #9ca3af; stroke-width: 1.5px; opacity: 0.85; }
    g.node text { fill: #111827; font: 11px/1.2 sans-serif; pointer-events: none; text-anchor: middle; }
    g.node circle { stroke: #374151; stroke-width: 1px; }
    #info {
      position: fixed; right: 16px; top: 64px; width: 340px; max-height: 75vh; overflow:auto;
      background: #ffffff; border:1px solid #e5e7eb; border-radius: 12px; padding: 12px 14px; box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      font-size: 13px;
    }
    #info h3 { margin: 0 0 6px 0; font-size: 15px; }
    #info .k { color:#6b7280; }
    #legend { position: fixed; left: 16px; top: 64px; background: #ffffff; border:1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px; font-size:12px; }
  </style>
  <script src="https://d3js.org/d3.v5.min.js" defer></script>
</head>
<body>
  <header>
    <label for="mainObj"><strong>Main Object Number:</strong></label>
    <input id="mainObj" type="text" list="objList" placeholder="Search or paste an Object Number…" />
    <datalist id="objList"></datalist>
    <button id="buildBtn">Build graph</button>
    <span class="hint">Circle size = number of matching fields with the main item.</span>
  </header>

  <div id="legend">Circle size = matches with main. Nodes are spaced using strong repulsion + collision.</div>
  <div id="info">Click a node to see details here.</div>

  <script>
  document.addEventListener("DOMContentLoaded", function () {
    const width = Math.min(window.innerWidth, 1200);
    const height = 760;

    const csvPath = "MetObjects-Cleaned-20sample.csv"; // place next to this HTML

    const columns = [
      "Object Number","Object ID","Gallery Number","Department","AccessionYear",
      "Object Name","Title","Culture","Period","Dynasty","Reign","Portfolio",
      "Artist Nationality","Object Begin Date","Object End Date","City","State","County",
      "Country","Region","Subregion","Locale","Classification","Tags"
    ];

    const svg = d3.select("body").append("svg")
      .attr("width", width)
      .attr("height", height);

    const info = d3.select("#info");

    // Display normalizer
    const norm = v => {
      if (v === undefined || v === null) return null;
      const s = String(v).trim();
      if (!s || s.toLowerCase() === "null" || s.toLowerCase() === "nan") return null;
      return s;
    };

    // Preserve punctuation, remove zero-width chars, collapse spaces for object number input
    const canon = v => {
      if (v == null) return null;
      return String(v)
        .normalize('NFKC')
        .replace(/[\u200B-\u200D\uFEFF]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    };
    const canonLower = v => {
      const c = canon(v);
      return c == null ? null : c.toLowerCase();
    };

    let dataRows = [];
    let byObjLower = new Map(); // canonical-lower Object Number -> row

    d3.csv(csvPath).then(rows => {
      dataRows = rows;

      // Build lookup by canonical object number
      byObjLower.clear();
      rows.forEach(r => {
        const key = canonLower(r["Object Number"]);
        if (key && !byObjLower.has(key)) byObjLower.set(key, r);
      });

      // Datalist (Object Number — Title)
      const options = Array.from(byObjLower.values());
      const dl = d3.select("#objList");
      dl.selectAll("option").remove();
      dl.selectAll("option")
        .data(options)
        .enter()
        .append("option")
        .attr("value", d => canon(d["Object Number"]))
        .attr("label", d => `${canon(d["Object Number"]) || ''} — ${canon(d.Title) || '(Untitled)'}`)
        .text(d => `${canon(d["Object Number"]) || ''} — ${canon(d.Title) || '(Untitled)'}`);

      const firstObjNo = options[0]?.["Object Number"] || "";
      console.log(`[Similarity Star] Loaded ${rows.length} rows; unique Object Numbers: ${options.length}`);
      d3.select("#mainObj").property("value", firstObjNo);
    }).catch(err => {
      console.error("CSV load error:", err);
      info.html("<b>Could not load CSV.</b> Start a local server (e.g., <code>python3 -m http.server 8000</code>), keep the CSV next to this HTML, and if using Git LFS run <code>git lfs pull</code> first.");
    });

    d3.select("#buildBtn").on("click", () => {
      const objInput = d3.select("#mainObj").property("value") || "";
      if (!dataRows.length) {
        info.html("<b>CSV not loaded yet.</b> Wait a second and try again. Check console for errors.");
        return;
      }
      buildGraph(objInput);
    });

    // Single Enter handler
    d3.select("#mainObj").on("keydown", function() {
      if (d3.event.key === "Enter") {
        const objInput = d3.select("#mainObj").property("value") || "";
        if (!dataRows.length) {
          info.html("<b>CSV not loaded yet.</b> Wait a second and try again. Check console for errors.");
          return;
        }
        buildGraph(objInput);
      }
    });

    function buildGraph(mainObjRaw) {
      svg.selectAll("*").remove(); // clear

      const gLinks = svg.append("g");
      const gNodes = svg.append("g");

      const mainObj = norm(mainObjRaw);
      if (!mainObj) {
        info.html("<b>Please type an Object Number from the CSV and click Build graph.</b>");
        return;
      }

      // Lookup via canonical map
      const mainRow = byObjLower.get(canonLower(mainObj));
      if (!mainRow) {
        info.html(`<b>No Object Number match found:</b> "${mainObjRaw}".<br/>Tip: pick from the dropdown or copy/paste exactly from the CSV.`);
        return;
      }

      const nodesMap = new Map();
      function makeId(row) {
        const objNo = norm(row["Object Number"]);
        return objNo || norm(row.Title) || ("id_" + Math.random().toString(36).slice(2));
      }

      const mainId = makeId(mainRow);
      nodesMap.set(mainId, { id: mainId, title: norm(mainRow.Title) || "(Untitled)", row: mainRow, main: true, matchCount: 0 });

      const links = [];
      const mainNorms = {};
      columns.forEach(c => mainNorms[c] = canonLower(mainRow[c]));

      dataRows.forEach(row => {
        if (row === mainRow) return;
        let matchCount = 0;
        const matchedCols = [];
        columns.forEach(c => {
          const a = mainNorms[c];
          const b = canonLower(row[c]);
          if (a && b && a === b) { matchCount++; matchedCols.push(c); }
        });
        if (matchCount > 0) {
          const id = makeId(row);
          if (!nodesMap.has(id)) {
            nodesMap.set(id, { id, title: norm(row.Title) || "(Untitled)", row, main: false, matchCount });
          } else {
            nodesMap.get(id).matchCount = Math.max(nodesMap.get(id).matchCount, matchCount);
          }
          links.push({ source: mainId, target: id, value: matchCount, matchedCols });
        }
      });

      const nodes = Array.from(nodesMap.values());
      if (nodes.length === 1) {
        info.html(`<b>Only the main node found.</b> No other items share fields with "<i>${nodes[0].title}</i>".`);
      }

      const mcVals = nodes.filter(n => !n.main).map(n => n.matchCount);
      const mcMin = mcVals.length ? Math.min(...mcVals) : 1;
      const mcMax = mcVals.length ? Math.max(...mcVals) : 1;
      const rScale = d3.scaleSqrt().domain([mcMin, mcMax]).range([10, 40]);

      const color = d3.scaleSequential()
        .domain([mcMin, mcMax])
        .interpolator(d3.interpolateHsl("hsl(210,70%,90%)", "hsl(210,90%,30%)"));

      const sim = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links)
          .id(d => d.id)
          .distance(d => 240 + Math.max(0, 20 * (mcMax - (d.value || 1))))
          .strength(0.8))
        .force("charge", d3.forceManyBody().strength(-800))
        .force("center", d3.forceCenter(width/2, height/2))
        .force("collide", d3.forceCollide().radius(d => (d.main ? 46 : rScale(d.matchCount) + 16)).iterations(2))
        .alpha(1)
        .alphaTarget(0.2)
        .on("tick", ticked);

      const mainNode = nodes.find(n => n.main);
      if (mainNode) { mainNode.fx = width / 2; mainNode.fy = height / 2; }

      gLinks.selectAll("path.link")
        .data(links)
        .enter()
        .append("path")
        .attr("class", "link")
        .append("title")
        .text(d => `Shared fields (${d.value}): ${d.matchedCols.join(", ")}`);

      const node = gNodes.selectAll("g.node")
        .data(nodes)
        .enter()
        .append("g")
        .attr("class", "node")
        .call(d3.drag()
          .on("start", dragstarted)
          .on("drag", dragged)
          .on("end", dragended))
        .on("click", showDetails);

      node.append("circle")
        .attr("r", d => d.main ? 46 : rScale(d.matchCount))
        .style("fill", d => d.main ? "#ffb4c2" : color(d.matchCount))
        .style("stroke-width", d => d.main ? 2 : 1.2);

      node.append("text")
        .attr("dy", d => (d.main ? 46 : rScale(d.matchCount)) + 14)
        .text(d => d.title)
        .style("font-weight", d => d.main ? "700" : "500");

      function ticked() {
        gLinks.selectAll("path.link").attr("d", d => `M${d.source.x},${d.source.y} L${d.target.x},${d.target.y}`);
        gNodes.selectAll("g.node").attr("transform", d => `translate(${d.x},${d.y})`);
      }

      function dragstarted(d) {
        if (d.main) return;
        if (!d3.event.active) sim.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
      }
      function dragged(d) {
        if (d.main) return;
        d.fx = d3.event.x; d.fy = d3.event.y;
      }
      function dragended(d) {
        if (d.main) { d.fx = width/2; d.fy = height/2; return; }
        if (!d3.event.active) sim.alphaTarget(0);
        d.fx = d.x; d.fy = d.y;
      }

      function showDetails(d) {
        const row = d.row || {};
        const nonNullPairs = [];
        columns.forEach(c => {
          const v = norm(row[c]);
          if (v !== null) nonNullPairs.push([c, v]);
        });

        let shared = [];
        if (!d.main) {
          const sharedCols = [];
          columns.forEach(c => {
            const a = canonLower(mainRow[c]);
            const b = canonLower(row[c]);
            if (a && b && a === b) sharedCols.push(c);
          });
          shared = sharedCols;
        }

        info.html("");
        info.append("h3").text((d.title || "(Untitled)") + (d.main ? " (Main)" : ""));
        if (!d.main) {
          info.append("div").style("margin","4px 0 8px 0")
              .html(`<b>Shared with main (${d.matchCount}):</b> ${shared.join(", ")}`);
        } else {
          info.append("div").style("margin","4px 0 8px 0")
              .html(`<b>Main node pinned at center.</b>`);
        }
        const dl = info.append("div");
        nonNullPairs.forEach(([k, v]) => {
          const line = dl.append("div").style("margin","2px 0");
          line.append("span").attr("class","k").text(k + ": ");
          line.append("span").text(v);
        });
        if (nonNullPairs.length === 0) {
          info.append("div").text("No non-null fields to display.");
        }
      }
    }
  });
  </script>
</body>
</html>
